name: Publish wind-motion to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'next.config.ts'
      - 'vite.config.ts'
      - 'package*.json'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Configure static export only for Pages
        run: |
          cat > next.config.ts <<'CONFIG'
          import type { NextConfig } from "next";
          const nextConfig: NextConfig = {
            output: "export",
            trailingSlash: true,
            basePath: "/wind-motion",
            assetPrefix: "/wind-motion/",
          };
          export default nextConfig;
          CONFIG
      - name: Build original application as static site
        run: ./node_modules/.bin/next build
      - name: Inspect and verify static output
        run: |
          echo "Candidate index.html files:"
          find out -type f -name 'index.html' || true
          echo "Build directories:"
          find out -maxdepth 3 -type d | head -60
          test -f out/index.html
          touch out/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: out
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
