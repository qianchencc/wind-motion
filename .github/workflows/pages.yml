name: Publish wind-motion to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'next.config.ts'
      - 'vite.config.ts'
      - 'package*.json'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Configure static export only for Pages
        run: |
          cat > next.config.ts <<'CONFIG'
          import type { NextConfig } from "next";
          const nextConfig: NextConfig = {
            output: "export",
            trailingSlash: true,
            basePath: "/wind-motion",
            assetPrefix: "/wind-motion/",
          };
          export default nextConfig;
          CONFIG
      - name: Adjust public asset URLs for project Pages path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          prefix = "/wind-motion"
          substitutions = [('/favicon.svg', prefix + '/favicon.svg')]
          substitutions += [('/references/', prefix + '/references/'), ('/fonts/', prefix + '/fonts/')]
          for folder in ['app', 'components', 'lib']:
              base = Path(folder)
              if not base.exists():
                  continue
              for file in base.rglob('*'):
                  if file.suffix not in {'.tsx', '.ts', '.jsx', '.js', '.css'}:
                      continue
                  original = file.read_text(encoding='utf-8')
                  updated = original
                  for before, after in substitutions:
                      updated = updated.replace(before, after)
                  # Source-file imports must remain repository-relative, not URL-prefixed.
                  updated = updated.replace('@/public/wind-motion/references/', '@/public/references/')
                  if updated != original:
                      file.write_text(updated, encoding='utf-8')
          PY
      - name: Build original application as static site
        run: ./node_modules/.bin/next build
      - name: Inspect and verify static output
        run: |
          echo "Candidate index.html files:"
          find out -type f -name 'index.html' || true
          echo "Build directories:"
          find out -maxdepth 3 -type d | head -60
          test -f out/index.html
          touch out/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: out
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
